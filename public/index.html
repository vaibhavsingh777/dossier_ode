<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chemical Dashboard - Ode Chem LLP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header
      style="
        background: var(--dossier-navy);
        color: white;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <h1 style="margin: 0; font-size: 1.5rem">Ode Chem LLP</h1>
      <button
        onclick="logout()"
        style="
          background: var(--dossier-purple);
          color: white;
          border: none;
          padding: 5px 15px;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Logout
      </button>
    </header>

    <main style="padding: 2rem; max-width: 1200px; margin: 0 auto">
      <div id="page-dossier"></div>
    </main>

    <script src="dossier.js"></script>

    <script>
      async function logout() {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
